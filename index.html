<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload File</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      padding:20px;
    }

    .container{
      width:450px;
      background:white;
      padding:35px;
      border-radius:25px;
      box-shadow:0 15px 35px rgba(0,0,0,0.3);
      text-align:center;
    }

    h1{
      color:#111827;
      margin-bottom:10px;
      font-size:45px;
    }

    p{
      color:#6b7280;
      margin-bottom:25px;
      font-size:15px;
    }

    .upload-box{
      border:2px dashed #3b82f6;
      border-radius:20px;
      padding:25px;
      margin-bottom:20px;
      background:#f8fafc;
      transition:0.3s;
    }

    .upload-box:hover{
      background:#eff6ff;
    }

    .upload-box h3{
      margin-bottom:15px;
      color:#111827;
      font-size:32px;
    }

    input[type=file]{
      width:100%;
      margin-top:10px;
    }

    .preview-container{
      margin-top:20px;
      display:none;
    }

    .preview-container img{
      width:100%;
      max-height:300px;
      object-fit:contain;
      border-radius:15px;
      border:2px solid #e5e7eb;
      background:#f3f4f6;
      padding:10px;
    }

    .file-name{
      margin-top:12px;
      font-size:14px;
      color:#374151;
      word-break:break-all;
    }

    .btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:14px;
      background:#2563eb;
      color:white;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      background:#1d4ed8;
    }

    .gallery-btn{
      display:block;
      width:100%;
      margin-top:15px;
      padding:14px;
      border-radius:14px;
      background:#16a34a;
      color:white;
      text-decoration:none;
      font-weight:bold;
      transition:0.3s;
      font-size:17px;
    }

    .gallery-btn:hover{
      background:#15803d;
    }

    .note{
      margin-top:18px;
      color:#9ca3af;
      font-size:12px;
    }

  </style>

</head>
<body>

<div class="container">

  <h1>Upload File</h1>

  <p>Pilih file yang ingin diunggah</p>

  <form action="upload.php" method="post" enctype="multipart/form-data">

    <div class="upload-box">

      <h3>Pilih File</h3>

      <input 
        type="file" 
        name="fileToUpload" 
        id="fileToUpload"
        accept="image/*"
        required
      >

      <div class="preview-container" id="previewContainer">

        <img id="previewImage" src="">

        <div class="file-name" id="fileName"></div>

      </div>

    </div>

    <button type="submit" class="btn">
      Upload Sekarang
    </button>

  </form>

  <a href="lihat_file.php" class="gallery-btn">
      Lihat Gallery
  </a>

  <div class="note">
    Maksimal ukuran file 500KB
  </div>

</div>

<script>

const fileInput = document.getElementById('fileToUpload');
const previewContainer = document.getElementById('previewContainer');
const previewImage = document.getElementById('previewImage');
const fileName = document.getElementById('fileName');

fileInput.addEventListener('change', function(){

    const file = this.files[0];

    if(file){

        const reader = new FileReader();

        reader.onload = function(e){

            previewImage.src = e.target.result;

            previewContainer.style.display = "block";

            fileName.textContent = file.name;

        }

        reader.readAsDataURL(file);

    }

});

</script>

</body>
</html>
